name: Deploy

# Every push to main builds the backend and puts it on the Oracle Cloud instance.
# The instance does not compile anything: it only receives the jar through SSH.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the one in progress instead of cutting it halfway.
concurrency:
  group: deploy-oracle
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Each run is listed under Deployments on the repository page, with its state and a link to the health check.
    environment:
      name: production
      url: https://api-kerolabs.duckdns.org/actuator/health

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build the jar
        run: ./mvnw -B -q package -DskipTests

      # The deploy key may only run pozzo-deploy on the server (forced in its authorized_keys): it receives
      # the jar on standard input, and root puts it in place, restarts the service and waits until
      # /actuator/health answers UP, sending the log of the start here meanwhile. If the new version does not
      # start, the server goes back to the previous one and this step fails.
      - name: Hand the jar to the server
        id: deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Only the host key checked when the secret was created is trusted.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          jar=$(ls target/*.jar | grep -v -- '-plain' | head -n 1)
          echo "Sending $(basename "$jar") ($(du -h "$jar" | cut -f1))"
          # The run and the commit go as the command, so the status page of the server can tell deploys apart.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "$DEPLOY_USER@$DEPLOY_HOST" "$GITHUB_RUN_ID $GITHUB_SHA" < "$jar" 2>&1 | tee deploy.log
          exit "${PIPESTATUS[0]}"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      # A short summary at the top of the run page: what was deployed and how it ended.
      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy to Oracle Cloud"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::7}\` $(git log -1 --format=%s | sed 's/|/\\|/g') |"
            echo "| By | ${GITHUB_ACTOR} |"
            echo "| Result | ${{ steps.deploy.outcome == 'success' && '✅ UP' || '❌ Failed' }} |"
            if [ -f deploy.log ]; then
              echo "| Server | $(grep -E '^(UP:|.* did not come up|Rolled back|No previous release)' deploy.log | tr '\n' ' ' | sed 's/|/\\|/g') |"
            fi
            echo "| Health | https://api-kerolabs.duckdns.org/actuator/health |"
            echo "| Status | https://api-kerolabs.duckdns.org/status |"
          } >> "$GITHUB_STEP_SUMMARY"
