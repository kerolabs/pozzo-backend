name: Tests

# Runs the unit, integration and acceptance tests on every pull request and on every push to develop
# and main. The integration and acceptance tests start PostgreSQL in a container, which the GitHub runner
# provides through Docker.
on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run the test suite
        run: ./mvnw -B test

      # The report of the Cucumber scenarios and the Surefire results, to read a failure without running it again.
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/cucumber-report.html
            target/surefire-reports/
          retention-days: 14
