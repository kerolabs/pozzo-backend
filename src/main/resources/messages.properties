error.validation.message=La validación falló
error.unauthorized.message=Se requiere autenticación
error.forbidden.message=No tienes permiso para realizar esta operación
error.not-found.message=No se encontró el recurso
error.conflict.message=El recurso está en conflicto
error.business-rule.message=Se incumplió una regla de negocio
error.too-many-requests.message=Espera un momento antes de volver a intentarlo
