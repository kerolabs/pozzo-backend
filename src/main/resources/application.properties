spring.application.name=pozzo

# Local development reads the credentials from a .env file in the project root
# (copy .env.example). In production they come from the host's environment variables.
spring.config.import=optional:file:.env[.properties]

# Render assigns the port through the PORT variable
server.port=${PORT:8080}

# Datasource (Supabase PostgreSQL, session pooler)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
