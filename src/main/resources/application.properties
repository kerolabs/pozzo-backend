spring.application.name=pozzo

# Local development reads the credentials from a .env file in the project root
# (copy .env.example). In production they come from the host's environment variables.
spring.config.import=optional:file:.env[.properties]

# Render assigns the port through the PORT variable
server.port=${PORT:8080}

# Health check used by Render; only the overall status is exposed
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Datasource (Supabase PostgreSQL, session pooler)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=pe.kerolabs.pozzo.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
# Each bounded context keeps its tables in its own schema; create the schemas when missing
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# Members authenticate with bearer tokens; the default in-memory user is not needed
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Signing key of the session and registration tokens (at least 32 characters)
authorization.jwt.secret=${JWT_SECRET}

# Delivery of the verification codes: "log" writes them to the console, "smsgate" sends them from an
# Android phone with the SMS Gate app, through its cloud server (credentials in the app's Cloud Server section)
sms.provider=${SMS_PROVIDER:log}
sms.smsgate.base-url=${SMSGATE_BASE_URL:https://api.sms-gate.app/3rdparty/v1}
sms.smsgate.username=${SMSGATE_USERNAME:}
sms.smsgate.password=${SMSGATE_PASSWORD:}
# Numbers that always receive sms.test-code and no SMS (comma-separated, nine digits each); empty disables them
sms.test-numbers=${SMS_TEST_NUMBERS:}
sms.test-code=${SMS_TEST_CODE:}

# Emails (account recovery codes): "log" writes them to the console, "brevo" sends them with the Brevo
# HTTPS API. SMTP is not an option because the free plan of Render blocks the SMTP ports.
email.provider=${EMAIL_PROVIDER:log}
email.brevo.api-key=${BREVO_API_KEY:}
email.from-address=${EMAIL_FROM_ADDRESS:}
email.from-name=${EMAIL_FROM_NAME:Pozzo}

# Profile photos: a public bucket of Supabase Storage in the same project as the database. The secret
# key (Project Settings > API Keys) lets the backend create the bucket and upload; leave both empty to disable photos.
photos.supabase.url=${SUPABASE_URL:}
photos.supabase.secret-key=${SUPABASE_SECRET_KEY:}
photos.supabase.bucket=${SUPABASE_PHOTOS_BUCKET:profile-photos}

# Private bucket of the receipt images, in the same Supabase project; they are only read through signed links
receipts.supabase.bucket=${SUPABASE_RECEIPTS_BUCKET:receipts}
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

# Base URL of the invitation links: a page of kerolabs.github.io that shows the code and how to join.
# The code is appended as is, so the URL ends with its separator.
invitations.link-base-url=${INVITATIONS_LINK_BASE_URL:https://kerolabs.github.io/unirme/?c=}

# Base URL of the public shared compliance history: a page of kerolabs.github.io that reads it from this API.
# The token is appended as is, so the URL ends with its separator.
compliance.shared-link-base-url=${COMPLIANCE_SHARED_LINK_BASE_URL:https://kerolabs.github.io/historial/?t=}

# Push notifications: "log" (default, written to the console) or "fcm" (Firebase Cloud Messaging)
push.provider=${PUSH_PROVIDER:log}
# Firebase service account JSON, raw or in Base64; required when push.provider=fcm
push.fcm.service-account=${FCM_SERVICE_ACCOUNT:}
# How often due notifications are sent, and the time zone of the reminders
notifications.dispatch-interval-ms=${NOTIFICATIONS_DISPATCH_INTERVAL_MS:60000}
notifications.time-zone=${NOTIFICATIONS_TIME_ZONE:America/Lima}

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Description and version come from the pom.xml
documentation.application.title=Pozzo Platform
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# i18n message bundles
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
