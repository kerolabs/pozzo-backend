# ==============================================================================
# POZZO BACKEND - APPLICATION CONFIGURATION PROPERTIES
# ==============================================================================
# This configuration file defines the runtime settings for the Pozzo RESTful backend.
# Local development values are read from a local .env file (copy .env.example).
# In production (e.g. Render, Railway, AWS), values are injected via environment variables.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. APPLICATION IDENTITY & CONFIGURATION IMPORT
# ------------------------------------------------------------------------------
# The name of the Spring Boot application context
spring.application.name=pozzo

# Automatically import the local .env file in the root directory if present.
# Does not fail if .env is missing (as in containerized production environments).
spring.config.import=optional:file:.env[.properties]

# ------------------------------------------------------------------------------
# 2. EMBEDDED SERVER & REVERSE PROXY HEADERS
# ------------------------------------------------------------------------------
# Server listening port, defaulting to 8080 or overridden by host platform (Render PORT variable)
server.port=${PORT:8080}

# Recognize X-Forwarded-* headers from reverse proxies (Caddy, Render, AWS ALB)
# Ensures OpenAPI and generated links use https:// scheme instead of http://
server.forward-headers-strategy=framework

# ------------------------------------------------------------------------------
# 3. ACTUATOR & HEALTH MONITORING
# ------------------------------------------------------------------------------
# Expose only the health check endpoint for platform liveness/readiness probes
management.endpoints.web.exposure.include=health

# Hide sensitive component details from the public health check probe
management.endpoint.health.show-details=never

# ------------------------------------------------------------------------------
# 4. DATASOURCE & HIKARICP CONNECTION POOL (SUPABASE POSTGRESQL)
# ------------------------------------------------------------------------------
# PostgreSQL JDBC connection URL (configured for Supabase session pooler)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Maximum active database connections in the Hikari pool
spring.datasource.hikari.maximum-pool-size=5

# Supabase session pooler aggressively drops idle connections.
# Keepalive ping (1 min) prevents pooler disconnections, and max lifetime (10 min)
# periodically recycles connections before remote termination occurs.
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=600000

# ------------------------------------------------------------------------------
# 5. JPA & HIBERNATE PERSISTENCE
# ------------------------------------------------------------------------------
# Disable Open-Session-In-View to prevent database queries during view rendering
spring.jpa.open-in-view=false

# Automatically update the database schema on startup to match entities
spring.jpa.hibernate.ddl-auto=update

# Custom physical naming strategy: converts camelCase to snake_case and pluralizes table names
spring.jpa.hibernate.naming.physical-strategy=pe.kerolabs.pozzo.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Automatically create PostgreSQL schemas for each bounded context if not present
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# ------------------------------------------------------------------------------
# 6. SECURITY & JWT AUTHORIZATION
# ------------------------------------------------------------------------------
# Disable default Spring Security auto-generated in-memory user details service
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# HMAC signing secret for session, registration, and recovery JWTs (minimum 32 characters)
authorization.jwt.secret=${JWT_SECRET}

# ------------------------------------------------------------------------------
# 7. SMS OTP VERIFICATION PROVIDER
# ------------------------------------------------------------------------------
# SMS provider driver: "log" (writes OTP to console log) or "smsgate" (SMS Gate Android gateway)
sms.provider=${SMS_PROVIDER:log}

# SMS Gate REST API base endpoint and credentials
sms.smsgate.base-url=${SMSGATE_BASE_URL:https://api.sms-gate.app/3rdparty/v1}
sms.smsgate.username=${SMSGATE_USERNAME:}
sms.smsgate.password=${SMSGATE_PASSWORD:}

# Comma-separated list of test phone numbers that receive dummy OTP without sending live SMS
sms.test-numbers=${SMS_TEST_NUMBERS:}
sms.test-code=${SMS_TEST_CODE:}

# ------------------------------------------------------------------------------
# 8. TRANSACTIONAL EMAIL PROVIDER (ACCOUNT RECOVERY)
# ------------------------------------------------------------------------------
# Email driver: "log" (writes email to console log) or "brevo" (Brevo HTTPS REST API)
# Render free tier blocks outbound SMTP ports, so an HTTPS REST API is required.
email.provider=${EMAIL_PROVIDER:log}
email.brevo.api-key=${BREVO_API_KEY:}
email.from-address=${EMAIL_FROM_ADDRESS:}
email.from-name=${EMAIL_FROM_NAME:Pozzo}

# ------------------------------------------------------------------------------
# 9. CLOUD STORAGE (SUPABASE STORAGE)
# ------------------------------------------------------------------------------
# Supabase project URL and service role secret key
photos.supabase.url=${SUPABASE_URL:}
photos.supabase.secret-key=${SUPABASE_SECRET_KEY:}

# Public bucket name for member avatar profile photos
photos.supabase.bucket=${SUPABASE_PHOTOS_BUCKET:profile-photos}

# Private bucket name for payment receipt proofs (accessed only via signed temporary URLs)
receipts.supabase.bucket=${SUPABASE_RECEIPTS_BUCKET:receipts}

# Maximum allowed file upload size for multipart requests (receipts and avatar photos)
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

# ------------------------------------------------------------------------------
# 10. PUBLIC SHAREABLE LINKS BASE URLS
# ------------------------------------------------------------------------------
# Base URL prefix for group invitation landing pages
invitations.link-base-url=${INVITATIONS_LINK_BASE_URL:https://kerolabs.github.io/unirme/?c=}

# Base URL prefix for public compliance history landing pages
compliance.shared-link-base-url=${COMPLIANCE_SHARED_LINK_BASE_URL:https://kerolabs.github.io/historial/?t=}

# ------------------------------------------------------------------------------
# 11. PUSH NOTIFICATIONS & DISPATCH SCHEDULER (FIREBASE CLOUD MESSAGING)
# ------------------------------------------------------------------------------
# Push notification driver: "log" (writes alert to console) or "fcm" (Firebase Cloud Messaging)
push.provider=${PUSH_PROVIDER:log}

# Firebase service account credentials (raw JSON or Base64 encoded)
push.fcm.service-account=${FCM_SERVICE_ACCOUNT:}

# Interval in milliseconds between background scheduled notification dispatch runs
notifications.dispatch-interval-ms=${NOTIFICATIONS_DISPATCH_INTERVAL_MS:60000}

# Default time zone for calculating reminder deadlines and cutoffs
notifications.time-zone=${NOTIFICATIONS_TIME_ZONE:America/Lima}

# ------------------------------------------------------------------------------
# 12. OPENAPI 3.0 / SWAGGER UI DOCUMENTATION
# ------------------------------------------------------------------------------
# Swagger UI interactive documentation path
springdoc.swagger-ui.path=/swagger-ui.html

# OpenAPI JSON specification endpoint
springdoc.api-docs.path=/v3/api-docs

# API documentation metadata filtered from pom.xml
documentation.application.title=Pozzo Platform
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# ------------------------------------------------------------------------------
# 13. INTERNATIONALIZATION (I18N)
# ------------------------------------------------------------------------------
# Basename for message bundle properties (messages.properties, messages_en.properties)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
