error.authentication-required.message=Sign in to continue
error.access-denied.message=You are not allowed to perform this operation
error.verification-code-resend-too-soon.message=Wait a few seconds before requesting a new code
error.verification-code-not-requested.message=Request a code for this number first
error.invalid-verification-code.message=The code is not correct
error.expired-verification-code.message=The code has expired. Request a new one
error.blocked-verification-code.message=You used all the allowed attempts. Request a new code
error.invalid-registration-token.message=The number verification has expired. Verify it again
error.terms-not-accepted.message=You must accept the Terms and Conditions and the Privacy Policy
error.account-deactivated.message=The account of this number is deactivated
error.account-conflict.message=This number already has an account
