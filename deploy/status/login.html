<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Estado de Pozzo</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    /* Hallmark · genre: modern-minimal · page: status login · theme: custom monochrome (paper 100% · ink 16%) · accent: none, status hues only */
    :root {
      color-scheme: light;
      --color-paper: oklch(100% 0 0);
      --color-paper-2: oklch(98.2% 0 0);
      --color-rule: oklch(92.5% 0 0);
      --color-rule-strong: oklch(84% 0 0);
      --color-ink: oklch(16% 0 0);
      --color-ink-2: oklch(44% 0 0);
      --color-ink-3: oklch(58% 0 0);
      --color-on-ink: oklch(100% 0 0);
      --color-bad: oklch(56% 0.2 27);
      --color-bad-soft: oklch(96% 0.025 27);
      --color-focus: oklch(56% 0.19 255);
      --font-body: "Geist", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "Geist Mono", ui-monospace, monospace;
      --space-2xs: 0.25rem; --space-xs: 0.5rem; --space-sm: 0.75rem; --space-md: 1rem;
      --space-lg: 1.5rem; --space-xl: 2rem; --space-2xl: 3rem;
      --text-xs: 0.75rem; --text-sm: 0.875rem; --text-md: 1rem; --text-xl: 1.5rem;
      --radius: 8px;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --dur-short: 150ms;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --color-paper: oklch(14.5% 0 0);
        --color-paper-2: oklch(18.5% 0 0);
        --color-rule: oklch(27% 0 0);
        --color-rule-strong: oklch(36% 0 0);
        --color-ink: oklch(96% 0 0);
        --color-ink-2: oklch(72% 0 0);
        --color-ink-3: oklch(56% 0 0);
        --color-on-ink: oklch(14.5% 0 0);
        --color-bad: oklch(70% 0.19 27);
        --color-bad-soft: oklch(25% 0.06 27);
        --color-focus: oklch(68% 0.16 255);
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { overflow-x: clip; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: var(--space-lg);
      background: var(--color-paper); color: var(--color-ink);
      font: 400 var(--text-md)/1.5 var(--font-body); -webkit-font-smoothing: antialiased;
    }
    main { width: 100%; max-width: 22rem; }
    .wordmark { font-weight: 600; letter-spacing: -0.02em; font-size: var(--text-md); }
    .wordmark span { color: var(--color-ink-3); font-weight: 400; }
    h1 { margin: var(--space-xl) 0 var(--space-2xs); font-size: var(--text-xl); font-weight: 600; letter-spacing: -0.025em; }
    .lede { margin: 0 0 var(--space-lg); color: var(--color-ink-2); font-size: var(--text-sm); }
    form { display: grid; gap: var(--space-md); }
    label { display: grid; gap: var(--space-xs); font-size: var(--text-sm); font-weight: 500; }
    input {
      font: inherit; font-size: var(--text-sm); height: 2.5rem; padding: 0 var(--space-sm);
      border: 1px solid var(--color-rule-strong); border-radius: var(--radius);
      background: var(--color-paper); color: var(--color-ink);
      transition: border-color var(--dur-short) var(--ease-out);
    }
    input:hover { border-color: var(--color-ink-3); }
    input:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 1px; border-color: transparent; }
    input[aria-invalid="true"] { border-color: var(--color-bad); }
    button {
      font: inherit; font-size: var(--text-sm); font-weight: 500; height: 2.5rem; border: 0; cursor: pointer;
      border-radius: var(--radius); background: var(--color-ink); color: var(--color-on-ink);
      transition: opacity var(--dur-short) var(--ease-out);
    }
    button:hover { opacity: 0.86; }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
    button:disabled { opacity: 0.5; cursor: progress; transform: none; }
    .error {
      margin: 0; padding: var(--space-sm) var(--space-md); border-radius: var(--radius);
      background: var(--color-bad-soft); color: var(--color-bad); font-size: var(--text-sm);
    }
    .host { margin-top: var(--space-2xl); color: var(--color-ink-3); font: var(--text-xs) var(--font-mono); }
  </style>
</head>
<body>
  <main>
    <div class="wordmark">pozzo <span>/ backend</span></div>
    <h1>Inicia sesión</h1>
    <p class="lede">Para ver el estado, los despliegues y los logs del servidor.</p>
    <form method="post" action="/status/login" id="form">
      <p class="error" id="error" role="alert" hidden></p>
      <label>Usuario
        <input name="user" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </label>
      <label>Contraseña
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit" id="submit">Continuar</button>
    </form>
    <div class="host" id="host"></div>
  </main>
  <script>
    (() => {
      document.getElementById("host").textContent = location.host;
      const reason = new URLSearchParams(location.search).get("error");
      if (reason) {
        const error = document.getElementById("error");
        error.textContent = reason === "blocked"
          ? "Demasiados intentos fallidos. Espera quince minutos y vuelve a intentarlo."
          : "Usuario o contraseña incorrectos.";
        error.hidden = false;
        document.querySelectorAll("input").forEach((input) => input.setAttribute("aria-invalid", "true"));
      }
      document.getElementById("form").addEventListener("submit", () => {
        const submit = document.getElementById("submit");
        submit.disabled = true;
        submit.textContent = "Verificando…";
      });
    })();
  </script>
</body>
</html>
